name: CI

on:
  push:
    branches: [ main, '**/*' ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build and run tests
        run: ./gradlew build --no-daemon --stacktrace

      - name: Build core bootJar
        run: ./gradlew :core:bootJar --no-daemon

      - name: Upload core JAR
        uses: actions/upload-artifact@v4
        with:
          name: core-bootjar
          path: core/build/libs/*.jar

  build-docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -f core/Dockerfile -t agentos-core:ci .
          docker save agentos-core:ci -o agentos-core-ci.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentos-core-image
          path: agentos-core-ci.tar
