spring:
  application:
    name: agentos
  datasource:
    url: jdbc:postgresql://${TENANT_DB_HOST:localhost}:5432/${DB_NAME:agentos}
    username: ${DB_USER:agentos}
    password: ${DB_PASSWORD:agentos}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.agentos: INFO
    com.agentos.core: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  security:
    jwt-secret: ${JWT_SECRET:defaultSecretKeyChangeMeInProductionAtLeast256BitsLongForHS256}
    jwt-expiration: 3600000
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://agentos.com
  audit:
    enabled: true
    retention-days: 365

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:agentos;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
