services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-agentos}
      POSTGRES_USER: ${DB_USER:-agentos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agentos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agentos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TENANT_DB_HOST: postgres
      DB_NAME: ${DB_NAME:-agentos}
      DB_USER: ${DB_USER:-agentos}
      DB_PASSWORD: ${DB_PASSWORD:-agentos}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
